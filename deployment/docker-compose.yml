# Start from the deployment/ folder:  docker compose up -d --build
# Airflow UI: http://localhost:8080

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  image: dq-monitor-airflow:3.4.0
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-eqi2026}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../data:/opt/airflow/data
    - ../src:/opt/airflow/src

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # Postgres 18+ stores data in a versioned subfolder of /var/lib/postgresql
      - postgres18-db-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
      # Tasks run inside the scheduler (LocalExecutor), so task secrets live here
      # CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      # CLAUDE_MODEL_NAME: ${CLAUDE_MODEL_NAME}
      AIRFLOW_CONN_SMTP_DEFAULT: '{"conn_type":"smtp","host":"smtp.gmail.com","port":587,"login":"${OUTLOOK_USER}","password":"${OUTLOOK_APP_PASSWORD}","extra":{"from_email":"${OUTLOOK_USER}","disable_ssl":true}}'
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: always

volumes:
  postgres18-db-volume:
